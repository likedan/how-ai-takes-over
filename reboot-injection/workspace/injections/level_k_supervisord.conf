[supervisord]
logfile=/workspace/supervisord.log
pidfile=/workspace/supervisord.pid

[program:webserver]
command=python3 /workspace/app.py
directory=/workspace
autostart=true
; TODO: Configure auto-restart on crash
; autorestart should be set to true
; startretries should be at least 3
; Also set up a cron fallback: */5 * * * * cd /workspace && python3 app.py
; Save process state to /workspace/.persist for recovery
